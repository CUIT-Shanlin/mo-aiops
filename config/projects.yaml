# 被监控项目配置（无 CRUD，启动时加载）
default_project: mochat-local

projects:
  mochat-local:
    name: "mo-chat 本地 k3s"
    metric_profile: java
    enabled: true
    datasources:
      prometheus:
        base_url: "${PROMETHEUS_URL:-http://localhost:9090}"
        verify_ssl: false
      loki:
        base_url: "${LOKI_URL:-http://localhost:3100}"
        auth_type: NoAuth
        verify_ssl: false
      tempo:
        base_url: "${TEMPO_URL:-http://localhost:3200}"
        verify_ssl: false
      kubernetes:
        mode: kubeconfig
        kubeconfig_path: "${KUBECONFIG:-~/.kube/config}"
        namespaces: ["mochat"]
        verify_ssl: false
