{{- if and .Values.rbac.create .Values.rbac.clusterWide }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "mo-chat-aiops.fullname" . }}-readonly
  labels:
    {{- include "mo-chat-aiops.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "nodes", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "mo-chat-aiops.fullname" . }}-readonly
  labels:
    {{- include "mo-chat-aiops.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "mo-chat-aiops.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "mo-chat-aiops.fullname" . }}-readonly
{{- else if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "mo-chat-aiops.fullname" . }}-readonly
  labels:
    {{- include "mo-chat-aiops.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "mo-chat-aiops.fullname" . }}-readonly
  labels:
    {{- include "mo-chat-aiops.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "mo-chat-aiops.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "mo-chat-aiops.fullname" . }}-readonly
{{- end }}
