# Helm 部署配置 — 敏感值不要写在这里，通过 .env.deploy + deploy.sh 注入
# 参考: .env.deploy.example

replicaCount: 1

image:
  repository: mo-chat-aiops
  tag: "0.1.0"
  pullPolicy: Never

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

command: []
args:
  - uvicorn
  - app.main:app
  - --host
  - 0.0.0.0
  - --port
  - "8000"
  - --workers
  - "1"

serviceAccount:
  create: true
  annotations: {}
  name: ""

rbac:
  create: true
  clusterWide: true

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: NodePort
  port: 8000
  targetPort: http
  nodePort: 32080
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: aiops.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

startupProbe:
  enabled: false
  path: /health
  initialDelaySeconds: 10
  periodSeconds: 10
  failureThreshold: 30

readinessProbe:
  enabled: true
  path: /health
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 6

livenessProbe:
  enabled: true
  path: /health
  initialDelaySeconds: 30
  periodSeconds: 20
  timeoutSeconds: 3
  failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity: {}

env:
  REDIS_DB: "1"
  ADMIN_USERNAME: admin
  ADMIN_PASSWORD_HASH: plain:admin
  PROJECTS_CONFIG_PATH: /etc/mo-chat-aiops/projects.yaml
  STARTUP_PROVIDER_VALIDATION: "false"
  STARTUP_COLLECTOR_ENABLED: "false"  # 演示数据由 app.seeds.run 注入，关采集器避免覆盖
  STARTUP_INGEST_ENABLED: "true"
  LLM_PROVIDER: openai
  LLM_BASE_URL: https://api.deepseek.com/v1
  LLM_MODEL: deepseek-v4-pro
  LOG_FORMAT: json
  ENVIRONMENT: prod
  CORS_ORIGINS: "*"

secret:
  create: true
  name: ""
  # 敏感值占位，deploy.sh 会通过 --set-string 覆盖
  data:
    DATABASE_URL: ""
    REDIS_URL: ""
    JWT_SECRET: ""
    ADMIN_PASSWORD_HASH: ""
    LLM_API_KEY: ""

extraEnv: []
extraEnvFrom: []

projectsConfig:
  mountPath: /etc/mo-chat-aiops/projects.yaml
  content: |
    default_project: mochat-prod

    projects:
      mochat-prod:
        name: "mo-chat 生产"
        metric_profile: java
        enabled: true
        datasources:
          prometheus:
            base_url: "http://prometheus.mochat-observability.svc.cluster.local:9090"
            verify_ssl: false
          loki:
            base_url: "http://loki.mochat-observability.svc.cluster.local:3100"
            auth_type: NoAuth
            verify_ssl: false
          tempo:
            base_url: "http://tempo.mochat-observability.svc.cluster.local:3200"
            verify_ssl: false
          kubernetes:
            mode: in_cluster
            namespaces: ["mochat"]
            verify_ssl: false

extraVolumes: []
extraVolumeMounts: []
